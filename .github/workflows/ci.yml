name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Integrity Scan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.12" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax & bytecode compilation check
        run: |
          python -m compileall -q .

      - name: Secret & credential safety scan
        run: |
          python scripts/secret_scan.py --working-tree-only

      - name: Verify test count threshold
        run: |
          python -c "import unittest; loader = unittest.TestLoader(); suite = loader.discover('tests'); count = suite.countTestCases(); print(f'Discovered {count} tests'); assert count >= 142, f'Test count {count} is below threshold 142'"

      - name: Set up Node.js for frontend regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install development-only frontend test tools
        run: npm ci --ignore-scripts

      - name: Run test suite (Standard Library)
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s marketscope/tests

      - name: Check workspace modules and interactions
        run: |
          node --check marketscope/static/workspace.js
          node --check marketscope/static/workspace-api.js
          npm test
